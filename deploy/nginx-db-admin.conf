# Painel do banco (Prisma Studio) atras de usuario/senha, num subdominio proprio.
#
# O Prisma Studio NAO tem tela de login nenhuma - fica seguro so porque nunca
# fica exposto direto, sempre atras deste basic auth do Nginx, e a porta 5555
# nunca precisa ser aberta no firewall (o Nginx fala com ela por dentro do
# proprio servidor, em 127.0.0.1).
#
# Passo a passo:
#
# 1) No provedor do dominio (onde voce comprou indicafacil.pro), crie um
#    registro DNS tipo A: nome "db", valor 169.58.247.51. Espere alguns
#    minutos para propagar.
#
# 2) No servidor, crie a senha (uma vez so):
#      sudo apt-get install -y apache2-utils   # se "htpasswd" nao existir ainda
#      sudo htpasswd -c /etc/nginx/db-admin.htpasswd admin
#    (ele pede pra digitar a senha duas vezes; guarde-a)
#
# 3) Instale este arquivo:
#      sudo cp deploy/nginx-db-admin.conf /etc/nginx/sites-available/db-admin
#      sudo ln -sf /etc/nginx/sites-available/db-admin /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#
# 4) Suba o Prisma Studio (fica preso so no localhost, nunca exposto sozinho):
#      cd /var/www/indicaterras/backend
#      nohup npx prisma studio --port 5555 --browser none > /tmp/prisma-studio.log 2>&1 &
#
# 5) Acesse http://db.indicafacil.pro (o navegador vai pedir usuario/senha).
#    Depois de confirmar que funciona, rode "sudo certbot --nginx -d db.indicafacil.pro"
#    pra ganhar HTTPS nesse subdominio tambem.
#
# Para desligar o Prisma Studio quando nao precisar mais: pkill -f "prisma studio"

# "Connection: upgrade" só pode ir nas requisições que pedem upgrade de verdade
# (o websocket que o Prisma Studio usa) - mandar isso em toda requisição quebra
# as chamadas normais de busca de dados das tabelas. Esse map decide por linha.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name db.indicafacil.pro;

    location / {
        auth_basic "Painel do banco";
        auth_basic_user_file /etc/nginx/db-admin.htpasswd;

        proxy_pass http://127.0.0.1:5555/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;

        # Prisma Studio usa websocket pra atualizar os dados ao vivo
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
