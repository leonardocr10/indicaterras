# Nginx para o Alphas Indica rodando num servidor só.
#
# O Angular é servido como arquivo estático e as rotas da API vão para o Node
# na porta 3000. Sem esta separação, o Nginx devolve o index.html para tudo —
# os GET respondem 200 com HTML e o POST do login responde 405.
#
# Instalação:
#   sudo cp deploy/nginx-indicaterras.conf /etc/nginx/sites-available/indicaterras
#   sudo ln -sf /etc/nginx/sites-available/indicaterras /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name 169.58.247.51;   # troque pelo domínio quando tiver um

    # Onde ficam os arquivos gerados por: npm run build --prefix frontend
    root /var/www/indicaterras/frontend/dist/frontend/browser;
    index index.html;

    client_max_body_size 12M;   # as fotos enviadas chegam por aqui
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- Rotas da API ----
    # Uma linha por prefixo do backend. Ao criar um controlador novo com prefixo
    # diferente, acrescente aqui, senão a rota cai no site e responde 405.
    location ~ ^/(auth|admin|admin-reports|admin-reviews|admin-sections|admin-settings|categories|category-services|comments|condominiums|dashboard|favorites|me|professionals|public-settings|recommendations|reports|reviews|uploads|users|docs)(/|$) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- Arquivos do app ----
    # Cache longo só para o que tem hash no nome; o index.html nunca é cacheado,
    # senão o navegador continua abrindo a versão antiga depois de um deploy.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Rotas internas do Angular (/app/home, /admin/denuncias, ...)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
