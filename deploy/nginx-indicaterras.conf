# Nginx para o Alphas Indica rodando num servidor só.
#
# O Angular é servido como arquivo estático e a API do Node fica inteira sob
# /api/*, para nunca colidir com uma rota de página do Angular (ex.: a pagina
# /admin/dashboard do site e o endpoint GET /admin/dashboard da API tinham o
# mesmo caminho antes disso, e o Nginx entregava o JSON da API no lugar do site).
#
# Instalação:
#   sudo cp deploy/nginx-indicaterras.conf /etc/nginx/sites-available/indicaterras
#   sudo ln -sf /etc/nginx/sites-available/indicaterras /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name 169.58.247.51;   # troque pelo domínio quando tiver um

    # Onde ficam os arquivos gerados por: npm run build --prefix frontend
    root /var/www/indicaterras/frontend/dist/frontend/browser;
    index index.html;

    client_max_body_size 12M;   # as fotos enviadas chegam por aqui
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- API do Node (prefixo fixo, definido em backend/src/main.ts) ----
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Documentação Swagger, fora do prefixo /api
    location /docs {
        proxy_pass http://127.0.0.1:3000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Fotos enviadas (perfil, capa, trabalhos) — servidas pelo Node como arquivo estático
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ---- Arquivos do app ----
    # Cache longo só para o que tem hash no nome; o index.html nunca é cacheado,
    # senão o navegador continua abrindo a versão antiga depois de um deploy.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Rotas internas do Angular (/app/home, /admin/denuncias, ...)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
