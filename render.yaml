# Publicação do backend no Render (https://render.com).
# No painel: New > Blueprint > aponte para este repositório.
# As variáveis marcadas com sync: false são preenchidas por você no painel — nunca ficam no repositório.
services:
  - type: web
    name: indicaterras-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /public-settings
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Endereço do site publicado na Vercel, para liberar o CORS.
      # Ex.: https://indicaterras.vercel.app
      - key: CORS_ORIGIN
        sync: false
    disk:
      # As fotos dos comentários são gravadas em disco; sem este volume elas somem a cada deploy.
      name: uploads
      mountPath: /opt/render/project/src/backend/uploads
      sizeGB: 1
