# Publicação do backend no Render (https://render.com).
# No painel: New > Blueprint > aponte para este repositório.
# As variáveis marcadas com sync: false são preenchidas por você no painel — nunca ficam no repositório.
services:
  - type: web
    name: indicaterras-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    # --include=dev e obrigatorio: NODE_ENV=production faz o npm pular as
    # dependencias de desenvolvimento, e o build precisa do CLI do Nest e do Prisma.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /public-settings
    envVars:
      - key: NODE_ENV
        value: production
      # A instancia gratuita tem 512 MB; sem esse teto o build do TypeScript
      # pode ser encerrado por falta de memoria.
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Endereço do site publicado na Vercel, para liberar o CORS.
      # Ex.: https://indicaterras.vercel.app
      - key: CORS_ORIGIN
        sync: false
    # Disco persistente para as fotos enviadas (comentários, trabalhos, perfis).
    # O plano free do Render NÃO aceita disco: o bloco abaixo só funciona em um
    # plano pago (troque plan: free por starter e remova o comentário).
    # Enquanto estiver no free, as fotos se perdem a cada novo deploy.
    # disk:
    #   name: uploads
    #   mountPath: /opt/render/project/src/backend/uploads
    #   sizeGB: 1
